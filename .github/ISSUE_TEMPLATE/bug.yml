name: Bug Report
description: Report a reproducible bug in dsh-maestro-mobile.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please search existing issues to avoid duplicates.
        For security vulnerabilities, use private reporting: https://github.com/ddtcorex/dsh-maestro-mobile/security/advisories

  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm view @ddtcorex/dsh-maestro-mobile version` or version in package.json
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Drawer / overlay (sidebar → drawer)
        - Sheets (settings / explorer / preview)
        - Safe-area / status-bar / notch
        - Composer / permission capsule
        - Reconciler / effects (reconciler-core, phone-chrome)
        - Styles / CSS (base → layout → compat → misc)
        - Cordis plugin (src/index.ts / cordis.patch.yml / build)
        - Documentation / README
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js, pnpm, DSH versions, browser + viewport width
      render: bash
      placeholder: |
        uname -a
        node --version
        pnpm --version
        dsh --version
        Browser: Chrome 120, viewport 390px (phone) / 1024px (desktop)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable dsh-maestro-mobile, start DSH Web, set viewport to 390px
        2. ...
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell

  - type: textarea
    id: contact
    attributes:
      label: Contact
      description: Optional — how to reach you for follow-up (also reachable at kaido4492@gmail.com)
      placeholder: kaido4492@gmail.com
